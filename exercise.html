<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#dff5ff">
<title>ガラスの靴で焼肉へ</title>
<style>
*{box-sizing:border-box}
body{margin:0;color:#254b65;background:linear-gradient(145deg,#f5fcff,#dff3ff 55%,#e8eaff);font-family:-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh}
main{max-width:560px;margin:auto;padding:30px 18px 60px}
header{text-align:center;padding:12px 0 24px}
small{letter-spacing:2px;color:#52768d}
h1{font-size:25px;font-weight:600;margin:12px 0}
h2{font-size:18px;margin:0 0 16px}
p{line-height:1.7}
.card{background:#ffffffcf;border:1px solid white;border-radius:24px;padding:22px;margin-bottom:18px;box-shadow:0 8px 28px #5e99bd15}
.score{font-size:52px;color:#277da7;font-weight:600}
.muted{color:#597486;font-size:13px}
.track{height:18px;background:#e4edf3;border-radius:20px;overflow:hidden;margin:16px 0}
.fill{height:100%;background:linear-gradient(90deg,#a6e8f5,#60bde8,#b6cafa);transition:width .5s}
button,input{font:inherit}
button{cursor:pointer;touch-action:manipulation}
.actions{display:grid;gap:12px}
.action{padding:18px;text-align:left;color:#245c7a;background:linear-gradient(120deg,#f7fdff,#dff3ff);border:1px solid #b8dfef;border-radius:16px;font-weight:600}
.action span{float:right;color:#277da7}
button:active{transform:scale(.98)}
input{padding:10px;border:1px solid #b8d6e5;border-radius:10px;background:white;color:#254b65;max-width:100%}
.date{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
.plain{background:#f0f8fc;border:1px solid #cfE4ef;border-radius:10px;color:#365c74;padding:9px 12px}
.month{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.week{text-align:center;font-size:12px;padding:6px 0;color:#607b8c}
.day{min-height:53px;border:0;border-radius:10px;background:#edf1f5;color:#536b7d;padding:6px 1px;font-size:12px;text-align:center}
.day b{display:block;font-size:11px;margin-top:5px}
.day.active{background:linear-gradient(140deg,#c2eff8,#9dd4f5);color:#174d6e}
.day.today{outline:2px solid #3e91bd;outline-offset:-2px}
.day:disabled{opacity:.45;cursor:default}
.chart{display:flex;height:145px;gap:8px;align-items:stretch}
.col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:6px;min-width:0;font-size:11px}
.bar{width:75%;background:linear-gradient(#9de3f1,#72b9e8);border-radius:7px 7px 2px 2px;min-height:3px}
.row{padding:12px 0;border-bottom:1px solid #e2edf4;display:flex;justify-content:space-between;gap:12px}
.row:last-child{border:0}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
#notice{min-height:24px;color:#21698b;font-size:14px}
footer{text-align:center;font-size:12px;color:#56758a;line-height:1.8}
</style>
</head>
<body>
<main>
<header>
<small>SMALL STEPS, LITTLE MAGIC</small>
<h1>🩵 ガラスの靴で焼肉へ</h1>
<div class="muted">今日のひと動きが、ごほうびになる。</div>
</header>

<section class="card">
<h2>✨ あなたの積み重ね</h2>
<div><span id="total" class="score">0</span> ポイント</div>
<div class="track"><div id="fill" class="fill"></div></div>
<p id="goal"></p>
<div id="gap" class="muted"></div>
</section>

<section class="card">
<h2>今日の運動を記録</h2>
<div class="date">
<label for="date">記録する日</label>
<input id="date" type="date">
</div>
<div class="actions">
<button class="action" data-kind="walk">🚶 2000歩 <span>＋1</span></button>
<button class="action" data-kind="abs">💪 腹筋 合計100回 <span>＋1</span></button>
<button class="action" data-kind="gym">🏋️ ちょこザップ30分 <span>＋1</span></button>
</div>
<p class="muted">腹筋は分けてOK。4000歩なら2回押してね。</p>
<button id="undo" class="plain">↩ 最後の1件を取り消す</button>
<div id="notice" role="status" aria-live="polite"></div>
</section>

<section class="card">
<div class="month">
<button id="prev" class="plain" aria-label="前の月">‹</button>
<h2 id="month" style="margin:0"></h2>
<button id="next" class="plain" aria-label="次の月">›</button>
</div>
<div id="calendar" class="calendar"></div>
<p class="muted">水色は運動を記録した日。日付を押すと、その日の記録を追加できます。</p>
</section>

<section class="card">
<h2>直近7日間のポイント</h2>
<div id="chart" class="chart"></div>
</section>

<section class="card">
<h2>📖 日付ごとの記録</h2>
<div id="history"></div>
<div class="tools">
<button id="backup" class="plain">記録を書き出す</button>
<button id="restore" class="plain">記録を読み込む</button>
<input id="file" type="file" accept=".json,application/json" hidden>
</div>
</section>

<footer>
休んだ日があっても、貯めたポイントはそのまま。<br>
記録はこの端末のブラウザに保存されます。<br>
ときどき「記録を書き出す」で控えを残してね。
</footer>
</main>
<script>
const $=id=>document.getElementById(id);
const KEY='glass-shoes-exercise-v1';
const names={walk:'2000歩',abs:'腹筋100回',gym:'ちょこザップ30分'};
const pad=n=>String(n).padStart(2,'0');
const key=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const today=()=>key(new Date());
const parse=s=>new Date(s+'T00:00:00');
function validDate(s){
 return typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)
 &&!isNaN(parse(s))&&key(parse(s))===s&&s<=today();
}
function validRecords(a){
 return Array.isArray(a)&&a.every(r=>r&&validDate(r.date)
 &&Object.hasOwn(names,r.kind));
}
let records=[];
try{
 const saved=JSON.parse(localStorage.getItem(KEY)||'[]');
 if(!validRecords(saved))throw Error();
 records=saved;
}catch(e){
 alert('保存済みの記録を読み込めませんでした。バックアップがあれば読み込んでください。');
}
let shown=new Date();
shown=new Date(shown.getFullYear(),shown.getMonth(),1);
$('date').value=today();
$('date').max=today();

function commit(next,message){
 try{localStorage.setItem(KEY,JSON.stringify(next));}
 catch(e){alert('記録を保存できませんでした。ブラウザの保存設定や空き容量を確認してください。');return;}
 records=next;render();$('notice').textContent=message;
}
function totals(){
 const result={};
 records.forEach(r=>result[r.date]=(result[r.date]||0)+1);
 return result;
}
function render(){
 const sums=totals(),total=records.length;
 $('total').textContent=total;
 const remainder=total%20;
 $('fill').style.width=(total>0&&remainder===0?100:remainder*5)+'%';
 const earned=Math.floor(total/20);
 $('goal').textContent=total===0?'焼肉まで、あと20ポイント 🥩':
 earned>0?`🥩 焼肉${earned}回分を達成！ 次の20ポイントまであと${20-remainder}ポイント`:
 `焼肉まで、あと${20-total}ポイント 🥩`;
 const dates=Object.keys(sums).sort().reverse();
 if(!dates.length){
  $('gap').textContent='最初の記録を、ここから。';
 }else{
  const days=Math.round((parse(today())-parse(dates[0]))/86400000);
  $('gap').textContent=days===0?'今日は運動の記録があります 🩵':
   `最後の運動記録は${days}日前です。`;
 }
 $('month').textContent=`${shown.getFullYear()}年${shown.getMonth()+1}月`;
 $('calendar').replaceChildren();
 for(const label of ['日','月','火','水','木','金','土']){
  const el=document.createElement('div');el.className='week';
  el.textContent=label;$('calendar').append(el);
 }
 for(let i=0;i<shown.getDay();i++){
  $('calendar').append(document.createElement('div'));
 }
 const end=new Date(shown.getFullYear(),shown.getMonth()+1,0).getDate();
 for(let i=1;i<=end;i++){
  const d=key(new Date(shown.getFullYear(),shown.getMonth(),i));
  const btn=document.createElement('button');
  btn.className='day'+(sums[d]?' active':'')+(d===today()?' today':'');
  btn.textContent=i;btn.disabled=d>today();
  const points=document.createElement('b');
  points.textContent=sums[d]?sums[d]+'pt':'';
  btn.append(points);
  btn.setAttribute('aria-label',`${d} ${sums[d]||0}ポイント`);
  btn.onclick=()=>{
   $('date').value=d;
   $('date').scrollIntoView({behavior:'smooth',block:'center'});
   $('notice').textContent=d+' の運動を追加できます';
  };
  $('calendar').append(btn);
 }
 const recent=[];
 for(let i=6;i>=0;i--){
  const d=parse(today());d.setDate(d.getDate()-i);
  recent.push({label:`${d.getMonth()+1}/${d.getDate()}`,n:sums[key(d)]||0});
 }
 const max=Math.max(3,...recent.map(d=>d.n));
 $('chart').replaceChildren();
 recent.forEach(d=>{
  const col=document.createElement('div');col.className='col';
  const count=document.createElement('span');count.textContent=d.n+'pt';
  const bar=document.createElement('div');bar.className='bar';
  bar.style.height=(d.n/max*100+3)+'px';
  const label=document.createElement('span');label.textContent=d.label;
  col.append(count,bar,label);$('chart').append(col);
 });
 $('history').replaceChildren();
 if(!dates.length)$('history').textContent='まだ記録がありません。';
 dates.forEach(d=>{
  const row=document.createElement('div');row.className='row';
  const left=document.createElement('div');
  const title=document.createElement('div');
  title.textContent=`${Number(d.slice(0,4))}年${Number(d.slice(5,7))}月${Number(d.slice(8))}日`;
  const detail=document.createElement('div');detail.className='muted';
  detail.textContent=Object.keys(names).map(k=>{
   const n=records.filter(r=>r.date===d&&r.kind===k).length;
   return n?names[k]+(n>1?` ×${n}`:''):'';
  }).filter(Boolean).join('・');
  left.append(title,detail);
  const right=document.createElement('strong');right.textContent=sums[d]+'pt';
  row.append(left,right);$('history').append(row);
 });
}
document.querySelectorAll('[data-kind]').forEach(btn=>{
 btn.onclick=()=>{
  const date=$('date').value;
  if(!validDate(date)){alert('今日以前の日付を選んでください。');return;}
  commit([...records,{date,kind:btn.dataset.kind}], '🩵 1ポイント記録しました');
 };
});
$('undo').onclick=()=>{
 if(!records.length)return;
 const last=records[records.length-1];
 if(confirm(`${last.date} の「${names[last.kind]}」を1件取り消しますか？`))
  commit(records.slice(0,-1),'最後の1件を取り消しました');
};
$('prev').onclick=()=>{
 shown=new Date(shown.getFullYear(),shown.getMonth()-1,1);render();
};
$('next').onclick=()=>{
 shown=new Date(shown.getFullYear(),shown.getMonth()+1,1);render();
};
$('backup').onclick=()=>{
 const blob=new Blob([JSON.stringify(records,null,2)],{type:'application/json'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');
 a.href=url;a.download='exercise-'+today()+'.json';a.click();
 setTimeout(()=>URL.revokeObjectURL(url),10000);
};
$('restore').onclick=()=>$('file').click();
$('file').onchange=async e=>{
 const file=e.target.files[0];if(!file)return;
 try{
  const data=JSON.parse(await file.text());
  if(!validRecords(data))throw Error();
  if(confirm(`${data.length}件の記録に置き換えますか？ 今の記録は上書きされます。`))
   commit(data,'記録を読み込みました');
 }catch(e){alert('このファイルは読み込めませんでした。');}
 $('file').value='';
};
render();
</script>
</body>
</html>
